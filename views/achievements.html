<section class="page">
  <header class="page-header">
    <h1>Achievements</h1>
  </header>

  <section class="section-block" id="achievementsSection">
    <div class="section-header">
      <h2>Search Options</h2>
    </div>

    <div class="section-block search-form-grid">
      <div class="field-control">
        <label class="field-label" for="achievementSearchQuery">Query</label>
        <div class="input-with-button">
          <input
            id="achievementSearchQuery"
            class="text-input"
            type="text"
            data-storage-key="gw2toolbox.achievements.query"
            data-persist="true"
            data-clearable="true"
            placeholder="Search achievements..."
          />
          <button type="button" class="clear-button hidden" aria-label="Clear query">×</button>
        </div>
      </div>

      <div class="select-picker" data-storage-key="gw2toolbox.achievements.rewards" data-multiselect="true" data-placeholder="Rewards" data-clearable="true">
        <label class="field-label">Rewards</label>
        <div class="input-with-button">
          <input class="text-input select-picker-input" readonly placeholder="Select rewards..." type="text" />
          <button type="button" class="clear-button hidden" aria-label="Clear rewards selection">×</button>
        </div>
        <div class="select-picker-dropdown hidden">
          <input class="text-input select-search" type="search" placeholder="Filter rewards..." />
          <ul class="select-picker-options">
            <li class="select-picker-option select-picker-all" data-action="select-all"><span>Select all</span><span class="option-check"></span></li>
            <li class="select-picker-option" data-value="Titles"><span>Titles</span><span class="option-check"></span></li>
            <li class="select-picker-option" data-value="Masteries"><span>Masteries</span><span class="option-check"></span></li>
            <li class="select-picker-option" data-value="None"><span>None</span><span class="option-check"></span></li>
            <li class="select-picker-option" data-value="AP"><span>AP</span><span class="option-check"></span></li>
          </ul>
        </div>
      </div>

      <div class="select-picker" data-storage-key="gw2toolbox.achievements.show" data-multiselect="true" data-placeholder="Show" data-clearable="true">
        <label class="field-label">Show</label>
        <div class="input-with-button">
          <input class="text-input select-picker-input" readonly placeholder="Select status..." type="text" />
          <button type="button" class="clear-button hidden" aria-label="Clear show selection">×</button>
        </div>
        <div class="select-picker-dropdown hidden">
          <input class="text-input select-search" type="search" placeholder="Filter statuses..." />
          <ul class="select-picker-options">
            <li class="select-picker-option select-picker-all" data-action="select-all"><span>Select all</span><span class="option-check"></span></li>
            <li class="select-picker-option" data-value="Started"><span>Started</span><span class="option-check"></span></li>
            <li class="select-picker-option" data-value="Finished"><span>Finished</span><span class="option-check"></span></li>
            <li class="select-picker-option" data-value="Unstarted"><span>Unstarted</span><span class="option-check"></span></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <section class="section-block hidden" id="missingApiKeySection">
    <div class="section-header">
      <h2>Missing API Key</h2>
    </div>
    <div class="text-body">
      <p>To load achievements we require a Guild Wars 2 API key. Please configure your API key before returning to this page.</p>
    </div>
    <button class="action-button" id="configureApiKeyButton" type="button">Configure API Key</button>
  </section>
</section>
